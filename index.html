<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Films | SINEKULTURA</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<main class="wrap">
  <section id="hero"></section>
  <h2>Browse Filipino films</h2>
  <form class="filters" id="filters" onsubmit="return false">
    <input type="search" id="q" placeholder="Search title or director" aria-label="Search">
    <select id="genre" aria-label="Genre"><option value="">All genres</option></select>
    <select id="year" aria-label="Release year"><option value="">All years</option></select>
    <button class="btn ghost" type="reset" id="reset">Reset</button>
  </form>
  <div class="grid" id="grid"></div>
</main>
<script src="js/db.js"></script><script src="js/home.js"></script>
</body></html>
